[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "causal-mirror"
version = "0.1.0"
description = "自指性 Agent 原型：计算力学驱动的自我认知与改进系统"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "statsmodels>=0.13.0",
    "graphviz>=0.20",
    "openai>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
